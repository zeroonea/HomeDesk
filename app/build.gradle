plugins {
    id 'com.android.application'
}

// Release signing key lives in keystore/ (created by build.ps1 on the first build; GitHub Actions writes it
// from repository secrets). Keep it: a different key means Android refuses to install the new APK over the old one.
// Without it the release APK is built unsigned.
def ksProps = new Properties()
def ksFile = rootProject.file('keystore/keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

android {
    namespace 'com.papyper.homedesk'
    compileSdk 35

    defaultConfig {
        applicationId 'com.papyper.homedesk'
        minSdk 30
        targetSdk 35
        versionCode 10
        versionName '1.9'
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file('keystore/' + ksProps['storeFile'])
                storePassword ksProps['password']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['password']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists())
                signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // WebView extras: origin-restricted JS bridge + script injection (clipboard)
    implementation 'androidx.webkit:webkit:1.12.1'
}
