name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # create releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Same key every time, so new APKs install over older ones. See README "Releases".
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No KEYSTORE_BASE64 secret: building an unsigned APK"
            exit 0
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          printf 'storeFile=release.jks\nkeyAlias=%s\npassword=%s\n' "${KEY_ALIAS:-homedesk}" "$KEYSTORE_PASSWORD" \
            > keystore/keystore.properties

      - name: Build
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        run: |
          version=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" app/build.gradle)
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "HomeDesk-$version.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "HomeDesk-$version-unsigned.apk"
          fi
          ls -l HomeDesk-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HomeDesk
          path: HomeDesk-*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls HomeDesk-*-unsigned.apk >/dev/null 2>&1; then
            echo "::error::Releases need the signing secrets (see README)"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" HomeDesk-*.apk --title "HomeDesk ${GITHUB_REF_NAME#v}" --generate-notes
